<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock ESO EHR</title>
<style>body{font-family:sans-serif;padding:16px} .tab{padding:6px 10px;background:#eee;cursor:pointer} .tab.active{background:#3b82f6;color:#fff} canvas{border:1px solid #999;touch-action:none} #status{white-space:pre;font-family:monospace;font-size:12px}</style>
</head>
<body style="margin:0;padding:0 16px 16px">
<div id="topbar" style="position:sticky;top:0;margin:0 -16px 8px;height:64px;background:#2f3a4a;display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;white-space:nowrap"><span style="font-size:22px">&#8964;</span><span style="font-weight:900;font-size:26px">eso</span><span id="pt"><small style="font-size:9px;display:block">PATIENT</small><span id="ptname" style="font-size:20px">UNNAMED PATIENT</span></span><span id="pid" style="margin-left:auto;font-size:11px;width:70px;line-height:1.2">POSITIVE IDENTIFICATION</span><span>&#9673;</span><span>&#9636;</span><span>&#9776;</span></div>
<h1>Mock ESO EHR</h1>
<div style="margin:6px 0"><button id="quick" class="tab" style="background:#ddd"><span>QUICK</span> <span>VITALS</span></button> <button id="quickincident" class="tab" style="background:#ddd">INCIDENT</button></div>
<nav id="tabs" style="display:flex;gap:8px;margin:8px 0">
  <div class="tab" data-view="Incident">INCIDENT</div><div class="tab" data-view="Patient">PATIENT</div><div class="tab" data-view="Vitals">VITALS</div>
  <div class="tab" data-view="FlowchartTreatments">FLOWCHART</div><div class="tab" data-view="Assessments">ASSESSMENTS</div><div class="tab" data-view="Narrative">NARRATIVE</div>
  <div class="tab" data-view="Forms">FORMS</div><div class="tab" data-view="Billing">BILLING</div><div class="tab" data-view="Signatures">SIGNATURES</div>
</nav>
<p>Fake single-page app that talks to the mock API the same way the real ESO app does.</p>
<div><label>Signature</label><br><canvas id="sig" width="300" height="100"></canvas></div>
<table id="vitals" style="border-collapse:collapse;margin:8px 0 8px 48px"></table>
<div id="status"></div>
<script src="/ehr/app.js"></script>
</body>
</html>
