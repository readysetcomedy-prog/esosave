<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock ESO EHR</title>
<style>body{font-family:sans-serif;padding:16px} .field{margin:14px 0;width:640px} .field .line{border-bottom:1px solid #999;display:flex;justify-content:space-between;padding:6px 0} .picker-icon{cursor:pointer;color:#2a7fd4} #addhist{background:#2ecc71;color:#fff;border:0;padding:14px 60px;font-size:16px} shelf-panel{display:block;position:fixed;top:0;right:0;width:600px;height:100%;background:#fff;box-shadow:-4px 0 12px rgba(0,0,0,.3);z-index:1000;overflow:auto} shelf-panel header{display:flex;justify-content:space-between;padding:12px} shelf-panel li{list-style:none;padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer;display:flex} check-mark{display:inline-block;width:18px;height:18px;border:1px solid #888;margin-right:10px} check-mark.selected{background:#2ecc71} .tab{padding:6px 10px;background:#eee;cursor:pointer;text-decoration:none;color:inherit;display:inline-block} .tab.active{background:#3b82f6;color:#fff} canvas{border:1px solid #999;touch-action:none} #status{white-space:pre;font-family:monospace;font-size:12px}</style>
</head>
<body style="margin:0;padding:0 16px 16px">
<div id="topbar" style="position:sticky;top:0;margin:0 -16px 8px;height:64px;background:#2f3a4a;display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;white-space:nowrap"><span style="font-size:22px">&#8964;</span><span style="font-weight:900;font-size:26px">eso</span><span id="pt"><small style="font-size:9px;display:block">PATIENT</small><span id="ptname" style="font-size:20px">UNNAMED PATIENT</span></span><span id="pid" style="margin-left:auto;font-size:11px;width:70px;line-height:1.2">POSITIVE IDENTIFICATION</span><span>&#9673;</span><span>&#9636;</span><span>&#9776;</span></div>
<h1>Mock ESO EHR</h1>
<!-- ESO's lightning-bolt bar: quick-entry buttons above the tab strip, one of them labelled plainly VITALS -->
<div id="bolt" style="margin:6px 0;background:#e74c3c;padding:6px"><button id="quick" class="tab" style="background:#e74c3c;color:#fff;font-weight:700">VITALS</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">GENERAL</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">MEDS</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">CPR</button> <button id="quickincident" class="tab" style="background:#ddd">INCIDENT</button></div>
<nav id="tabs" style="display:flex;gap:8px;margin:8px 0">
  <a class="tab" data-view="Incident" href="#/pcr/x/incident">INCIDENT</a><a class="tab" data-view="Patient" href="#/pcr/x/patient">PATIENT</a><a class="tab" data-view="Vitals" href="#/pcr/x/vitals">VITALS</a>
  <a class="tab" data-view="FlowchartTreatments" href="#/pcr/x/flowcharttreatments">FLOWCHART</a><a class="tab" data-view="Assessments" href="#/pcr/x/assessments">ASSESSMENTS</a><a class="tab" data-view="Narrative" href="#/pcr/x/narrative">NARRATIVE</a>
  <a class="tab" data-view="Forms" href="#/pcr/x/forms">FORMS</a><a class="tab" data-view="Billing" href="#/pcr/x/billing">BILLING</a><a class="tab" data-view="Signatures" href="#/pcr/x/signatures">SIGNATURES</a>
</nav>
<p>Fake single-page app that talks to the mock API the same way the real ESO app does.</p>
<div><label>Signature</label><br><canvas id="sig" width="300" height="100"></canvas></div>
<table id="vitals" style="border-collapse:collapse;margin:8px 0 8px 48px"></table>
<!-- Patient tab, drawn like ESO's: an Add History button, then the next field -->
<section id="patient" style="display:none;width:700px;margin-left:48px">
  <div><button id="addhist" class="green">Add History</button></div>
  <div style="margin-top:40px"><label>Medical History Obtained From</label><div class="line"></div></div>
  <ul id="histlist"></ul>
</section>
<!-- Narrative tab: an acuity field with a list icon, like ESO's -->
<section id="narrative" style="display:none;width:700px;margin-left:48px">
  <div class="field"><label>Initial Patient Acuity</label><div class="line"><span id="ia"></span><span class="picker-icon" ng-click="open()" data-field="initial">&#9776;</span></div></div>
  <div class="field"><label>Final Patient Acuity</label><div class="line"><span id="fa"></span><span class="picker-icon" ng-click="open()" data-field="final">&#9776;</span></div></div>
</section>
<!-- ESO's picker shelf, built the way ESO builds it -->
<div id="shelfhost"></div>
<div id="status"></div>
<script src="/ehr/app.js"></script>
</body>
</html>
