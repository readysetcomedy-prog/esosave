<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock ESO EHR</title>
<style>body{font-family:sans-serif;padding:16px} .tab{padding:6px 10px;background:#eee;cursor:pointer;text-decoration:none;color:inherit;display:inline-block} .tab.active{background:#3b82f6;color:#fff} canvas{border:1px solid #999;touch-action:none} #status{white-space:pre;font-family:monospace;font-size:12px}</style>

<body style="margin:0;padding:0 16px 16px">

<h1>Mock ESO EHR</h1>

<div id="bolt" style="margin:6px 0;background:#e74c3c;padding:6px"><button id="quick" class="tab" style="background:#e74c3c;color:#fff;font-weight:700">VITALS</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">GENERAL</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">MEDS</button> <button class="tab" style="background:#e74c3c;color:#fff;font-weight:700">CPR</button> <button id="quickincident" class="tab" style="background:#ddd">INCIDENT</button></div>
<nav id="tabs" style="display:flex;gap:8px;margin:8px 0">
  <a class="tab" data-view="Incident" href="#/pcr/x/incident">INCIDENT</a><a class="tab" data-view="Patient" href="#/pcr/x/patient">PATIENT</a><a class="tab" data-view="Vitals" href="#/pcr/x/vitals">VITALS</a>

  <a class="tab" data-view="Forms" href="#/pcr/x/forms">FORMS</a><a class="tab" data-view="Billing" href="#/pcr/x/billing">BILLING</a><a class="tab" data-view="Signatures" href="#/pcr/x/signatures">SIGNATURES</a>
</nav>

<div><label>Signature</label><br><canvas id="sig" width="300" height="100"></canvas></div>
<table id="vitals" style="border-collapse:collapse;margin:8px 0 8px 48px"></table>
<div id="status"></div>
<script src="/ehr/app.js"></script>
</body>
</html>
